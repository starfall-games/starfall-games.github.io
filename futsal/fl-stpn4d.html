    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(D.salt), iterations: D.it, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(D.iv) }, key, u8(D.ct)));
    try { if (keep) localStorage.setItem('futsal-real-pass', pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    try { localStorage.removeItem('futsal-real-pass'); } catch (e2) {}
    err.textContent = 'パスワードがちがうよ';
  }
}
document.getElementById('go').onclick = () => open(document.getElementById('pw').value.trim(), document.getElementById('keep').checked);
document.getElementById('pw').onkeydown = e => { if (e.key === 'Enter') document.getElementById('go').click(); };
let saved = null; try { saved = localStorage.getItem('futsal-real-pass'); } catch (e) {}
if (saved) open(saved, true);
